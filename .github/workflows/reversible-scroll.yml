name: Reversible scroll motion
on:
  push:
    branches:
      - fix/final-scroll-motion-20260825
    paths:
      - .github/workflows/reversible-scroll.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-scroll-motion-20260825
          fetch-depth: 0
      - run: python tools/make_scroll_reversible.py
      - run: |
          git config user.name "ChatGPT Motion Repair"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add motion.js
          git diff --cached --quiet && exit 0
          git commit -m "Make scroll stories reversible"
          git push origin HEAD:fix/final-scroll-motion-20260825
