name: Desktop music and nav preview

on:
  push:
    branches: [desktop-music-nav-polish-20260826]

permissions:
  contents: write

jobs:
  apply-preview:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: desktop-music-nav-polish-20260826
      - name: Apply desktop review fixes
        run: |
          echo '' | base64 --decode | python3
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html motion.css images/deadpool-mask.svg
          git commit -m "Polish desktop music player and compact nav"
          git push origin HEAD:desktop-music-nav-polish-20260826
