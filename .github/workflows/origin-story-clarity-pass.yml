name: Origin Story Clarity Pass
on:
  push:
    branches:
      - fix/origin-story-motion-20260825
    paths:
      - tools/origin_story_clarity_pass.py
      - .github/workflows/origin-story-clarity-pass.yml
jobs:
  tune:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python tools/origin_story_clarity_pass.py
      - run: |
          git config user.name "ChatGPT Motion Repair"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add motion.js motion.css
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Refine Origin Story motion and career hover"
            git push
          fi
