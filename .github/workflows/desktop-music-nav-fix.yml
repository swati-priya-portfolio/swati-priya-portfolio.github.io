name: One-time desktop music hover and nav spacing fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-desktop-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply desktop-only interaction fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          index_path = Path('index.html')
          index = index_path.read_text()
          old_music = '<article class="board sp-settle">\n          <h3 class="board-title">MUSIC WHILE DESIGNING</h3>'
          new_music = '<article class="board sp-settle music-board" data-cursor="PLAY">\n          <h3 class="board-title">MUSIC WHILE DESIGNING</h3>'
          if old_music in index:
              index = index.replace(old_music, new_music, 1)
          elif new_music not in index:
              raise SystemExit('Music board target not found')

          if 'motion.css?v=27' in index:
              index = index.replace('motion.css?v=27', 'motion.css?v=28', 1)
          elif 'motion.css?v=28' not in index:
              raise SystemExit('Expected motion.css cache version not found')
          index_path.write_text(index)

          motion_path = Path('motion.css')
          motion = motion_path.read_text()
          marker = 'DESKTOP MUSIC HOVER + MINI NAV TIGHTEN'
          if marker not in motion:
              motion += r'''

/* ============================================================
   DESKTOP MUSIC HOVER + MINI NAV TIGHTEN
   Desktop-only polish. Mobile <= 767px remains untouched.
   ============================================================ */
@media (min-width: 1024px) and (hover: hover) and (pointer: fine) {
  .sp-js #behind .music-board {
    transition: transform 320ms var(--ep), border-color 320ms var(--ep),
                box-shadow 320ms var(--ep);
  }

  .sp-js #behind .music-board:hover {
    transform: translateY(-4px) scale(1.008) !important;
    border-color: rgba(255, 197, 61, 0.40);
    box-shadow: inset 0 0 12px 1px rgba(255, 217, 140, 0.08);
  }
}

@media (min-width: 1080px) {
  /* 430px left a large dead zone around the actual mini-nav content. */
  .sp-js .site-header.is-mini .nav-pill {
    max-width: 360px;
    gap: 8px;
    padding: 5px 8px 5px 6px;
  }

  .sp-js .site-header.is-mini .identity-group {
    gap: 6px;
  }

  .sp-js .site-header.is-mini .nav-available {
    margin-left: 0;
  }
}
'''
          motion_path.write_text(motion)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html motion.css
          git commit -m "Refine desktop music hover and compact nav spacing"
          git push origin main
