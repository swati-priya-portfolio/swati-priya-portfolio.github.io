name: One-time desktop music hover and nav spacing fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-desktop-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply desktop-only interaction fixes
        run: |
          echo '' | base64 --decode | python3
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html motion.css
          git commit -m "Refine desktop music hover and compact nav spacing"
          git push origin main
