name: Tighten Origin Motion
on:
  push:
    branches:
      - fix/origin-story-motion-20260825
    paths:
      - tools/tighten_origin_motion.py
      - .github/workflows/tighten-origin-motion.yml
jobs:
  tune:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python tools/tighten_origin_motion.py
      - run: |
          git config user.name "ChatGPT Motion Repair"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add motion.css
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Tighten Origin Story transformation timing"
            git push
          fi
