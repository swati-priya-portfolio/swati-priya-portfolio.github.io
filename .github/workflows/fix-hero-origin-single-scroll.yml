name: Fix Hero and Origin Motion
on:
  push:
    branches:
      - fix/final-scroll-motion-20260825
    paths:
      - .github/workflows/fix-hero-origin-single-scroll.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-scroll-motion-20260825
          fetch-depth: 0
      - run: python tools/fix_hero_origin_single_scroll.py
      - run: |
          git config user.name "ChatGPT Motion Repair"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add motion.js motion.css
          git diff --cached --quiet && exit 0
          git commit -m "Strengthen Hero mouse motion and compress Origin scroll"
          git push origin HEAD:fix/final-scroll-motion-20260825
