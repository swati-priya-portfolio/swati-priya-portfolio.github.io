name: Behind Nav Reference Fix
on:
  push:
    branches:
      - fix/origin-story-motion-20260825
    paths:
      - tools/behind_nav_reference_fix.py
      - .github/workflows/behind-nav-reference-fix.yml
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python tools/behind_nav_reference_fix.py
      - run: |
          git config user.name "ChatGPT Motion Repair"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html motion.css
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Match Behind reference and move contact CTA to mini nav"
            git push
          fi
