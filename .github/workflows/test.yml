name: Apply scroll repair
on:
  push:
    branches:
      - fix/final-scroll-motion-20260825
    paths:
      - .github/workflows/test.yml
      - tools/scroll_repair.py
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-scroll-motion-20260825
          fetch-depth: 0
      - run: python tools/scroll_repair.py
      - run: |
          git config user.name "ChatGPT Motion Repair"
          git config user.email "actions@users.noreply.github.com"
          git add motion.js
          git commit -m "[motion-fix] Repair scroll timing and footer completion"
          git push origin HEAD:fix/final-scroll-motion-20260825
