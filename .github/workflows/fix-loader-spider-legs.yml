name: Fix Loader Spider Legs
on:
  push:
    branches:
      - fix/origin-story-motion-20260825
    paths:
      - tools/fix_loader_spider_legs.py
      - .github/workflows/fix-loader-spider-legs.yml
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python tools/fix_loader_spider_legs.py
      - run: |
          git config user.name "ChatGPT Motion Repair"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add motion.css
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Make loader spiders fully yellow"
            git push
          fi
