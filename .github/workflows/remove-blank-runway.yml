name: Remove blank runway
on:
  push:
    branches:
      - fix/final-scroll-motion-20260825
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[blank-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-scroll-motion-20260825
          fetch-depth: 0
      - run: python tools/remove_blank_runway.py
      - run: |
          git config user.name "ChatGPT Motion Repair"
          git config user.email "actions@users.noreply.github.com"
          git add motion.css motion.js
          git commit -m "[blank-fix] Remove artificial scroll gaps" || exit 0
          git push origin HEAD:fix/final-scroll-motion-20260825
