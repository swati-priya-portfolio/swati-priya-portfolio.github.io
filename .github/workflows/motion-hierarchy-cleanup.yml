name: Motion Hierarchy Cleanup
on:
  push:
    branches:
      - fix/final-scroll-motion-20260825
    paths:
      - tools/motion_hierarchy_cleanup.py
      - .github/workflows/motion-hierarchy-cleanup.yml
jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python tools/motion_hierarchy_cleanup.py
      - run: |
          git config user.name "ChatGPT Motion Repair"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add motion.js motion.css
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Refine motion hierarchy and remove ambient effects"
            git push
          fi
