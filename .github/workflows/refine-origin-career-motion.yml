name: Refine Origin and Career Motion
on:
  push:
    branches:
      - fix/final-scroll-motion-20260825
    paths:
      - .github/workflows/refine-origin-career-motion.yml
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-scroll-motion-20260825
          fetch-depth: 0
      - run: python tools/refine_origin_career_motion.py
      - run: |
          git config user.name "ChatGPT Motion Repair"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add motion.js motion.css
          git diff --cached --quiet && exit 0
          git commit -m "Refine Origin and career motion"
          git push origin HEAD:fix/final-scroll-motion-20260825
# retry 2
