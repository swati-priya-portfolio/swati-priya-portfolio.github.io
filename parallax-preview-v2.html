<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Loading Parallax Preview…</title>
  <style>html,body{margin:0;min-height:100%;background:#17120b;color:#fff;font-family:Arial,sans-serif}body{display:grid;place-items:center;min-height:100vh}</style>
</head>
<body>
  <p>Loading preview…</p>
  <script>
    fetch('index.html?preview=parallax-v2', { cache: 'no-store' })
      .then(function (response) {
        if (!response.ok) throw new Error('Could not load index.html');
        return response.text();
      })
      .then(function (html) {
        html = html.replace('</body>', '<script src="parallax-preview.js?preview=2"><\\/script></body>');
        document.open();
        document.write(html);
        document.close();
      })
      .catch(function (error) {
        document.body.innerHTML = '<p>Preview failed to load. Please refresh.</p>';
        console.error(error);
      });
  </script>
</body>
</html>
